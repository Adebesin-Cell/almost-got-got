<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,600;9..144,0,900;9..144,1,400&family=Jost:wght@400;500&display=swap">
<style>
  *{ box-sizing:border-box; margin:0; }
  html,body{ width:1200px; height:630px; }
  body{
    background:#F4F3F0; color:#15120F;
    font-family:"Jost",sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px; position:relative;
  }
  .top{ display:flex; justify-content:space-between; align-items:center; font-size:19px; letter-spacing:.22em; text-transform:uppercase; color:#6C6862; }
  .mark{ width:44px; height:44px; background:#15120F; color:#F4F3F0; display:grid; place-items:center; font-family:"Fraunces",serif; font-weight:900; font-size:24px; border-radius:4px; }
  .mid{ }
  h1{ font-family:"Fraunces",serif; font-weight:900; font-size:150px; line-height:.86; letter-spacing:-.03em; }
  h1 em{ font-style:italic; font-weight:400; }
  .sub{ font-family:"Fraunces",serif; font-style:italic; font-size:34px; color:#2A2136; margin-top:26px; }
  .bottom{ display:flex; justify-content:space-between; align-items:baseline; font-size:22px; color:#6C6862; }
  .bottom .url{ color:#15120F; font-weight:500; }
  .rule{ position:absolute; left:72px; right:72px; bottom:118px; height:1px; background:#DCD8D1; }
</style>
</head>
<body>
  <div class="top"><span>A field guide to social engineering</span><span class="mark">A</span></div>
  <div class="mid">
    <h1>Almost <em>Got</em> Got</h1>
    <div class="sub">Fifteen scams. Fifteen ways to beat them.</div>
  </div>
  <div class="rule"></div>
  <div class="bottom"><span>CPE 510 · Federal University of Technology, Akure</span><span class="url">almostgotgot.vercel.app</span></div>
</body>
</html>
